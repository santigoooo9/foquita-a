<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Para mi Foquita ❤️</title>

    <!-- Fuentes Románticas e Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600;700&family=Great+Vibes&family=Quicksand:wght@400;600&display=swap" rel="stylesheet">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <style>
        /* Estilos generales */
        body {
            margin: 0;
            padding: 0;
            overflow-x: hidden;
            font-family: 'Quicksand', sans-serif;
            background: linear-gradient(to bottom, #070913 0%, #111827 50%, #1e1b4b 100%);
            color: #ffffff;
            min-height: 100vh;
        }

        /* Fuente para el Lettering aesthetic */
        .cursive-title {
            font-family: 'Great Vibes', 'Dancing Script', cursive;
        }

        /* Lienzo del fondo y flores */
        #night-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 1;
            pointer-events: none;
        }

        /* Mariposas flotantes */
        .butterfly-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
            z-index: 10;
        }

        .butterfly {
            position: absolute;
            width: 18px;
            height: 18px;
            opacity: 0.85;
            filter: drop-shadow(0 0 6px rgba(253, 224, 71, 0.8));
            animation: flyAround 15s infinite ease-in-out;
        }

        @keyframes flyAround {
            0% {
                transform: translate(0, 0) rotate(0deg) scale(0.9);
            }
            25% {
                transform: translate(80px, -120px) rotate(15deg) scale(1.1);
            }
            50% {
                transform: translate(-60px, -250px) rotate(-10deg) scale(0.95);
            }
            75% {
                transform: translate(100px, -380px) rotate(20deg) scale(1.05);
            }
            100% {
                transform: translate(0, -500px) rotate(0deg) scale(0.9);
            }
        }

        .wing {
            position: absolute;
            width: 10px;
            height: 14px;
            background: linear-gradient(45deg, #fef08a, #facc15, #f43f5e);
            border-radius: 50% 50% 10% 50%;
        }

        .wing-left {
            left: 0;
            transform-origin: right center;
            animation: flapLeft 0.25s infinite alternate ease-in-out;
        }

        .wing-right {
            right: 0;
            transform-origin: left center;
            border-radius: 50% 50% 50% 10%;
            animation: flapRight 0.25s infinite alternate ease-in-out;
        }

        @keyframes flapLeft {
            0% { transform: rotateY(0deg); }
            100% { transform: rotateY(70deg); }
        }

        @keyframes flapRight {
            0% { transform: rotateY(0deg); }
            100% { transform: rotateY(-70deg); }
        }

        /* Tarjeta de la carta con la imagen de fondo */
        .card-container {
            position: relative;
            z-index: 20;
            backdrop-filter: blur(2px);
            transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 15px 35px rgba(234, 179, 8, 0.2), 0 0 20px rgba(244, 63, 94, 0.2);
        }

        /* Estilo para acomodar la imagen proporcionada */
        .card-bg {
            background-image: url('image_9968a3.jpg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            position: absolute;
            inset: 0;
            border-radius: 1.5rem;
            opacity: 0.35; /* Suavizada para no opacar el texto */
            z-index: 0;
        }

        .card-overlay {
            position: relative;
            z-index: 10;
            background: rgba(26, 20, 36, 0.75);
            border: 1px solid rgba(254, 240, 138, 0.3);
            border-radius: 1.5rem;
        }

        /* Brillo dorado interactivo */
        .glow-text {
            text-shadow: 0 0 12px rgba(250, 204, 21, 0.8), 0 0 24px rgba(250, 204, 21, 0.4);
        }

        /* Botón aesthetic */
        .btn-magic {
            background: linear-gradient(135deg, #facc15 0%, #eab308 50%, #f43f5e 100%);
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(250, 204, 21, 0.4);
        }

        .btn-magic:hover {
            transform: translateY(-2px) scale(1.03);
            box-shadow: 0 6px 20px rgba(250, 204, 21, 0.6);
        }

        /* Animación suave de flotación de la carta */
        .floating-card {
            animation: float 6s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
        }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen p-4 relative">

    <!-- Lienzo interactivo para estrellas, flores amarillas, corazones y luciérnagas -->
    <canvas id="night-canvas"></canvas>

    <!-- Contenedor para mariposas voladoras -->
    <div id="butterfly-layer" class="butterfly-container"></div>

    <!-- Carta Principal -->
    <main class="w-full max-w-lg mx-auto my-auto floating-card">
        <div class="card-container relative rounded-3xl overflow-hidden p-1 border border-yellow-300/30">
            
            <!-- Imagen de fondo (Hello Kitty & Spiderman) -->
            <div class="card-bg"></div>

            <!-- Capa sobrepuesta con opacidad para contraste y legibilidad -->
            <div class="card-overlay p-6 sm:p-8 flex flex-col items-center text-center">
                
                <!-- Encabezado / Título principal con Lettering -->
                <div class="mb-4">
                    <span class="text-xs uppercase tracking-widest text-yellow-300/80 font-semibold mb-1 block">Una cartita especial</span>
                    <h1 class="cursive-title text-5xl sm:text-6xl text-yellow-300 glow-text py-2">
                        Te amo foquita
                    </h1>
                    <div class="w-24 h-1 bg-gradient-to-r from-transparent via-yellow-400 to-transparent mx-auto mt-1 rounded-full"></div>
                </div>

                <!-- Contenido de la carta -->
                <div class="w-full my-4 p-5 bg-stone-900/60 rounded-2xl border border-yellow-200/20 backdrop-blur-md shadow-inner text-left text-yellow-50/90 leading-relaxed max-h-60 overflow-y-auto custom-scrollbar">
                    <p class="text-base sm:text-lg font-light italic">
                        <!-- AQUÍ PUEDES PEGAR TU MENSAJE -->
                        queria decirte que te amo mucho mi amor, perdon (este es el mensaje donde tengo que modificar)
                    </p>
                </div>

                <!-- Detalle de firma/corazones -->
                <div class="flex items-center justify-center gap-2 text-rose-400 my-2">
                    <span>✨</span>
                    <span class="text-sm font-semibold tracking-wide text-yellow-200/90">Eres mi persona favorita</span>
                    <span>✨</span>
                </div>

                <!-- Botón Interactivo para regenerar/florecer más flores o reproducir efecto -->
                <div class="mt-4 flex flex-wrap gap-3 justify-center">
                    <button id="bloom-btn" class="btn-magic text-slate-950 font-bold px-6 py-2.5 rounded-full text-sm flex items-center gap-2">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 fill-current" viewBox="0 0 20 20">
                            <path fill-rule="evenodd" d="M3.172 5.172a4 4 0 015.656 0L10 6.343l1.172-1.171a4 4 0 115.656 5.656L10 17.657l-6.828-6.829a4 4 0 010-5.656z" clip-rule="evenodd"/>
                        </svg>
                        <span>¡Hacer florecer más!</span>
                    </button>
                    
                    <button id="sound-btn" class="bg-indigo-950/80 hover:bg-indigo-900/80 text-yellow-200 border border-yellow-400/30 px-4 py-2.5 rounded-full text-sm font-medium transition flex items-center gap-2">
                        <span id="sound-icon">🎵</span>
                        <span id="sound-text">Música de fondo</span>
                    </button>
                </div>

            </div>
        </div>
    </main>

    <!-- Audio de ambiente romántico (Opcional) -->
    <audio id="bg-music" loop preload="auto">
        <source src="https://cdn.pixabay.com/download/audio/2022/05/27/audio_1808fbf07a.mp3?filename=romantic-piano-112199.mp3" type="audio/mpeg">
    </audio>

    <script>
        /* === CONFIGURACIÓN Y ANIMACIONES DEL LIENZO (CANVAS) === */
        const canvas = document.getElementById('night-canvas');
        const ctx = canvas.getContext('2d');

        let width, height;

        // Ajustar el canvas al tamaño de ventana
        function resizeCanvas() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        // Arreglos para almacenar los objetos flotantes
        const stars = [];
        const fireflies = [];
        const flowers = [];
        const hearts = [];

        // 1. Crear Estrellas del Cielo Nocturno
        for (let i = 0; i < 120; i++) {
            stars.push({
                x: Math.random() * width,
                y: Math.random() * height * 0.7,
                size: Math.random() * 2,
                alpha: Math.random(),
                speed: Math.random() * 0.02 + 0.005
            });
        }

        // 2. Crear Luciérnagas Radiantes (Fireflies)
        for (let i = 0; i < 45; i++) {
            fireflies.push({
                x: Math.random() * width,
                y: Math.random() * height,
                size: Math.random() * 3 + 1.5,
                angle: Math.random() * Math.PI * 2,
                speed: Math.random() * 0.8 + 0.2,
                alpha: Math.random(),
                pulse: Math.random() * 0.03 + 0.01
            });
        }

        // Clase Flores Amarillas en animación paulatina
        class YellowFlower {
            constructor(x, y, maxRadius) {
                this.x = x;
                this.y = y;
                this.currentRadius = 0;
                this.maxRadius = maxRadius;
                this.growthSpeed = Math.random() * 0.2 + 0.1;
                this.petals = Math.floor(Math.random() * 4) + 8; // 8 a 12 pétalos
                this.petalColor = '#facc15'; // Amarillo radiante
                this.centerColor = '#78350f'; // Café suave centro
                this.stemHeight = Math.random() * 80 + 40;
                this.sway = Math.random() * 0.02;
                this.angle = 0;
            }

            draw() {
                // Tallo
                ctx.beginPath();
                ctx.moveTo(this.x, this.y);
                ctx.quadraticCurveTo(this.x + Math.sin(this.angle) * 10, this.y - this.stemHeight / 2, this.x, this.y - this.stemHeight);
                ctx.strokeStyle = '#15803d';
                ctx.lineWidth = 3;
                ctx.stroke();

                const flowerY = this.y - this.stemHeight;

                if (this.currentRadius > 0.5) {
                    // Dibujar Pétalos amarillos
                    for (let i = 0; i < this.petals; i++) {
                        const petalAngle = (i * (2 * Math.PI / this.petals)) + this.angle;
                        const petalX = this.x + Math.cos(petalAngle) * (this.currentRadius * 1.3);
                        const petalY = flowerY + Math.sin(petalAngle) * (this.currentRadius * 1.3);

                        ctx.beginPath();
                        ctx.arc(petalX, petalY, this.currentRadius * 0.6, 0, Math.PI * 2);
                        ctx.fillStyle = this.petalColor;
                        ctx.shadowBlur = 10;
                        ctx.shadowColor = '#fef08a';
                        ctx.fill();
                        ctx.shadowBlur = 0; // reset
                    }

                    // Centro de la Flor
                    ctx.beginPath();
                    ctx.arc(this.x, flowerY, this.currentRadius * 0.5, 0, Math.PI * 2);
                    ctx.fillStyle = this.centerColor;
                    ctx.fill();
                }
            }

            update() {
                if (this.currentRadius < this.maxRadius) {
                    this.currentRadius += this.growthSpeed;
                }
                this.angle += 0.01;
            }
        }

        // Corazones Brillantes Flotantes en el Campo
        class BloomingHeart {
            constructor(x, y) {
                this.x = x;
                this.y = y;
                this.size = 0;
                this.maxSize = Math.random() * 12 + 8;
                this.growthSpeed = Math.random() * 0.15 + 0.05;
                this.alpha = 0.8;
            }

            draw() {
                if (this.size <= 0) return;
                ctx.save();
                ctx.translate(this.x, this.y);
                ctx.beginPath();
                const topCurveHeight = this.size * 0.3;
                ctx.moveTo(0, topCurveHeight);
                // Dibujar forma de corazón
                ctx.bezierCurveTo(0, 0, -this.size / 2, 0, -this.size / 2, topCurveHeight);
                ctx.bezierCurveTo(-this.size / 2, (this.size + topCurveHeight) / 2, 0, this.size, 0, this.size);
                ctx.bezierCurveTo(0, (this.size + topCurveHeight) / 2, this.size / 2, (this.size + topCurveHeight) / 2, this.size / 2, topCurveHeight);
                ctx.bezierCurveTo(this.size / 2, 0, 0, 0, 0, topCurveHeight);
                ctx.closePath();

                ctx.fillStyle = `rgba(244, 63, 94, ${this.alpha})`;
                ctx.shadowBlur = 12;
                ctx.shadowColor = '#f43f5e';
                ctx.fill();
                ctx.restore();
            }

            update() {
                if (this.size < this.maxSize) {
                    this.size += this.growthSpeed;
                }
            }
        }

        // Generar campo inicial de flores amarillas y corazones
        function initField() {
            flowers.length = 0;
            hearts.length = 0;
            const count = Math.floor(width / 35); // Densidad según tamaño de pantalla

            for (let i = 0; i < count; i++) {
                const x = (width / count) * i + (Math.random() * 20 - 10);
                const y = height + 10;
                const size = Math.random() * 10 + 12;
                flowers.push(new YellowFlower(x, y, size));

                // Agregar corazones intercalados
                if (Math.random() > 0.4) {
                    hearts.push(new BloomingHeart(x + (Math.random() * 30 - 15), height - (Math.random() * 80 + 20)));
                }
            }
        }

        initField();

        // Bucle de Animación principal
        function animate() {
            // Fondo de Noche Cálida
            const bgGradient = ctx.createLinearGradient(0, 0, 0, height);
            bgGradient.addColorStop(0, '#070913');
            bgGradient.addColorStop(0.6, '#111827');
            bgGradient.addColorStop(1, '#1e1b4b');
            ctx.fillStyle = bgGradient;
            ctx.fillRect(0, 0, width, height);

            // Renderizar Estrellas Parpadeantes
            stars.forEach(star => {
                star.alpha += star.speed;
                if (star.alpha > 1 || star.alpha < 0) star.speed = -star.speed;
                ctx.fillStyle = `rgba(255, 255, 255, ${Math.abs(star.alpha)})`;
                ctx.fillRect(star.x, star.y, star.size, star.size);
            });

            // Renderizar Campo Verde/Oscuro en la base
            ctx.fillStyle = '#052e16';
            ctx.beginPath();
            ctx.ellipse(width / 2, height + 100, width * 0.8, 200, 0, 0, Math.PI * 2);
            ctx.fill();

            // Dibujar Flores y Corazones
            flowers.forEach(flower => {
                flower.update();
                flower.draw();
            });

            hearts.forEach(heart => {
                heart.update();
                heart.draw();
            });

            // Renderizar Luciérnagas Volando
            fireflies.forEach(firefly => {
                firefly.x += Math.cos(firefly.angle) * firefly.speed;
                firefly.y += Math.sin(firefly.angle) * firefly.speed;
                firefly.angle += (Math.random() - 0.5) * 0.1;

                firefly.alpha += firefly.pulse;
                if (firefly.alpha > 1 || firefly.alpha < 0.2) firefly.pulse = -firefly.pulse;

                // Mantener dentro de bordes
                if (firefly.x < 0) firefly.x = width;
                if (firefly.x > width) firefly.x = 0;
                if (firefly.y < 0) firefly.y = height;
                if (firefly.y > height) firefly.y = 0;

                // Dibujar destello de luciérnaga
                ctx.beginPath();
                ctx.arc(firefly.x, firefly.y, firefly.size, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(254, 240, 138, ${Math.abs(firefly.alpha)})`;
                ctx.shadowBlur = 15;
                ctx.shadowColor = '#facc15';
                ctx.fill();
                ctx.shadowBlur = 0;
            });

            requestAnimationFrame(animate);
        }

        animate();

        /* === GENERADOR DE MARIPOSAS EN MINIANURA === */
        const butterflyLayer = document.getElementById('butterfly-layer');

        function createButterflies(amount = 8) {
            for (let i = 0; i < amount; i++) {
                const butterfly = document.createElement('div');
                butterfly.className = 'butterfly';
                
                // Posición inicial aleatoria
                const startX = Math.random() * window.innerWidth;
                const startY = Math.random() * window.innerHeight * 0.8 + (window.innerHeight * 0.2);
                
                butterfly.style.left = `${startX}px`;
                butterfly.style.top = `${startY}px`;
                butterfly.style.animationDelay = `${Math.random() * 5}s`;
                butterfly.style.animationDuration = `${12 + Math.random() * 8}s`;

                // Crear alas
                const leftWing = document.createElement('div');
                leftWing.className = 'wing wing-left';

                const rightWing = document.createElement('div');
                rightWing.className = 'wing wing-right';

                butterfly.appendChild(leftWing);
                butterfly.appendChild(rightWing);

                butterflyLayer.appendChild(butterfly);
            }
        }

        createButterflies(10); // Generar 10 mariposas en pantalla

        /* === INTERACTIVIDAD DE BOTONES === */
        // Botón para florecer más flores
        document.getElementById('bloom-btn').addEventListener('click', () => {
            initField(); // Reinicia la animación de crecimiento lento
        });

        // Botón de audio / música
        const bgMusic = document.getElementById('bg-music');
        const soundBtn = document.getElementById('sound-btn');
        const soundIcon = document.getElementById('sound-icon');
        const soundText = document.getElementById('sound-text');
        let isPlaying = false;

        soundBtn.addEventListener('click', () => {
            if (!isPlaying) {
                bgMusic.play().then(() => {
                    isPlaying = true;
                    soundIcon.textContent = '🔊';
                    soundText.textContent = 'Pausar música';
                }).catch(err => console.log("Audio requiere interacción de usuario:", err));
            } else {
                bgMusic.pause();
                isPlaying = false;
                soundIcon.textContent = '🎵';
                soundText.textContent = 'Música de fondo';
            }
        });
    </script>
</body>
</html>
