<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Para mi Foquita ❤️</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Great+Vibes&family=Quicksand:wght@400;600&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body, html {
      width: 100%;
      height: 100%;
      overflow-x: hidden;
      font-family: 'Quicksand', sans-serif;
      background: radial-gradient(circle at bottom, #101c38 0%, #050a14 100%);
      color: #fff;
    }

    /* Fondo estrellado y noche */
    .stars {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 1;
    }
    .star {
      position: absolute;
      background: #fff;
      border-radius: 50%;
      animation: twinkle linear infinite;
    }
    @keyframes twinkle {
      0%, 100% { opacity: 0.2; transform: scale(0.8); }
      50% { opacity: 1; transform: scale(1.2); }
    }

    /* Contenedor principal */
    .main-container {
      position: relative;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      padding: 40px 20px 200px 20px;
      z-index: 10;
    }

    /* Carta */
    .card-container {
      position: relative;
      width: 100%;
      max-width: 480px;
      background: rgba(20, 15, 25, 0.75);
      border-radius: 25px;
      padding: 30px 25px;
      box-shadow: 0 10px 30px rgba(255, 215, 0, 0.25), 0 0 20px rgba(255, 182, 193, 0.2);
      border: 2px solid rgba(255, 215, 0, 0.4);
      backdrop-filter: blur(8px);
      text-align: center;
      overflow: hidden;
      margin-top: 20px;
    }

    /* Fondo de la carta con la imagen */
    .card-bg {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-image: url('imagen.jpg');
      background-size: cover;
      background-position: center;
      opacity: 0.18;
      z-index: -1;
      filter: sepia(30%) hue-rotate(-10deg);
    }

    .title-lettering {
      font-family: 'Great Vibes', cursive;
      font-size: 3.2rem;
      color: #ffe600;
      text-shadow: 0 0 12px rgba(255, 230, 0, 0.8), 0 0 25px rgba(255, 100, 100, 0.5);
      margin-bottom: 15px;
    }

    .message-body {
      font-family: 'Caveat', cursive;
      font-size: 1.6rem;
      line-height: 1.5;
      color: #fff9e6;
      text-shadow: 0 2px 4px rgba(0, 0, 0, 0.8);
      background: rgba(0, 0, 0, 0.35);
      padding: 20px;
      border-radius: 15px;
      border: 1px dashed rgba(255, 230, 0, 0.5);
    }

    /* Campo de flores al fondo */
    .garden {
      position: fixed;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 180px;
      pointer-events: none;
      z-index: 5;
      display: flex;
      justify-content: space-around;
      align-items: flex-end;
    }
    .flower {
      position: relative;
      animation: grow 3s ease-out forwards;
      transform-origin: bottom center;
    }
    @keyframes grow {
      0% { transform: scale(0) translateY(50px); opacity: 0; }
      100% { transform: scale(1) translateY(0); opacity: 1; }
    }

    /* Luciérnagas y Mariposas */
    .firefly, .butterfly {
      position: fixed;
      pointer-events: none;
      z-index: 8;
    }
    .firefly {
      width: 6px;
      height: 6px;
      background: #ffee7c;
      border-radius: 50%;
      box-shadow: 0 0 10px #ffee7c, 0 0 20px #ffaa00;
      animation: floatFirefly 6s ease-in-out infinite alternate;
    }
    @keyframes floatFirefly {
      0% { transform: translate(0, 0) scale(0.8); opacity: 0.3; }
      100% { transform: translate(30px, -60px) scale(1.3); opacity: 1; }
    }
    .butterfly {
      font-size: 18px;
      animation: fly 8s linear infinite;
    }
    @keyframes fly {
      0% { transform: translate(-10vw, 100vh) rotate(0deg); }
      50% { transform: translate(50vw, 40vh) rotate(20deg); }
      100% { transform: translate(110vw, -10vh) rotate(-10deg); }
    }
  </style>
</head>
<body>

  <div class="stars" id="stars"></div>

  <div class="main-container">
    <div class="card-container">
      <div class="card-bg"></div>
      <h1 class="title-lettering">Te amo foquita</h1>
      <div class="message-body">
        queria decirte que te amo mucho mi amor, perdon (este es el mensaje donde tengo que modificar)
      </div>
    </div>
  </div>

  <div class="garden" id="garden"></div>

  <script>
    // Generar estrellas
    const starsContainer = id('stars');
    for (let i = 0; i < 60; i++) {
      const star = document.createElement('div');
      star.className = 'star';
      star.style.width = Math.random() * 3 + 'px';
      star.style.height = star.style.width;
      star.style.left = Math.random() * 100 + '%';
      star.style.top = Math.random() * 100 + '%';
      star.style.animationDuration = (Math.random() * 3 + 2) + 's';
      starsContainer.appendChild(star);
    }

    // Generar luciérnagas
    for (let i = 0; i < 20; i++) {
      const f = document.createElement('div');
      f.className = 'firefly';
      f.style.left = Math.random() * 100 + 'vw';
      f.style.top = Math.random() * 100 + 'vh';
      f.style.animationDelay = (Math.random() * 5) + 's';
      document.body.appendChild(f);
    }

    // Generar mariposas
    const butterflies = ['🦋', '✨', '💛'];
    for (let i = 0; i < 8; i++) {
      const b = document.createElement('div');
      b.className = 'butterfly';
      b.innerText = butterflies[Math.floor(Math.random() * butterflies.length)];
      b.style.animationDelay = (i * 1.5) + 's';
      b.style.animationDuration = (Math.random() * 5 + 7) + 's';
      document.body.appendChild(b);
    }

    // Generar flores que florecen lentamente
    const garden = id('garden');
    const icons = ['🌼', '🌻', '💛', '🌸', '✨'];
    for (let i = 0; i < 15; i++) {
      const flower = document.createElement('div');
      flower.className = 'flower';
      flower.style.fontSize = (Math.random() * 20 + 30) + 'px';
      flower.innerText = icons[Math.floor(Math.random() * icons.length)];
      flower.style.animationDelay = (i * 0.2) + 's';
      garden.appendChild(flower);
    }

    function id(str) { return document.getElementById(str); }
  </script>
</body>
</html>
