<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Te amo foquita ❤️</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;1,400&family=Great+Vibes&family=Quicksand:wght@500;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body, html {
      width: 100%;
      height: 100%;
      overflow-x: hidden;
      font-family: 'Quicksand', sans-serif;
      background: radial-gradient(circle at 50% 100%, #17212e 0%, #050811 100%);
      color: #fff;
    }

    /* Fondo nocturno y luciérnagas */
    .night-sky {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 1;
    }
    .star {
      position: absolute;
      background: #fff;
      border-radius: 50%;
      animation: twinkle infinite ease-in-out;
    }
    @keyframes twinkle {
      0%, 100% { opacity: 0.2; transform: scale(0.8); }
      50% { opacity: 1; transform: scale(1.3); }
    }

    .firefly {
      position: fixed;
      width: 5px;
      height: 5px;
      background: #f7e479;
      border-radius: 50%;
      box-shadow: 0 0 10px #f7e479, 0 0 18px #e6a800;
      pointer-events: none;
      z-index: 8;
      animation: floatFirefly linear infinite alternate;
    }
    @keyframes floatFirefly {
      0% { transform: translate(0, 0) scale(0.7); opacity: 0.3; }
      100% { transform: translate(40px, -60px) scale(1.3); opacity: 1; }
    }

    /* Mariposas animadas */
    .butterfly-swarm {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 12;
      overflow: hidden;
    }

    .butterfly-unit {
      position: absolute;
      will-change: transform;
    }

    .butterfly-wings-wrapper {
      width: 26px;
      height: 24px;
      display: flex;
      justify-content: center;
      align-items: center;
      animation: flapWings 0.25s infinite alternate ease-in-out;
      filter: drop-shadow(0 0 6px rgba(247, 228, 121, 0.7));
    }

    @keyframes flapWings {
      0% { transform: rotateY(0deg) scale(0.9); }
      100% { transform: rotateY(70deg) scale(1.1); }
    }

    /* Contenedor central de la carta */
    .content-wrapper {
      position: relative;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      padding: 30px 15px 250px 15px;
      z-index: 10;
    }

    /* Carta compacta y estética */
    .cute-card {
      position: relative;
      width: 100%;
      max-width: 440px;
      border-radius: 24px;
      padding: 28px 22px;
      background-color: rgba(22, 16, 25, 0.82);
      border: 2px solid rgba(247, 228, 121, 0.5);
      box-shadow: 0 12px 35px rgba(247, 228, 121, 0.2), 0 0 25px rgba(255, 0, 119, 0.1);
      backdrop-filter: blur(10px);
      text-align: center;
      overflow: hidden;
    }

    .card-bg-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-image: url('imagen.jpg');
      background-size: cover;
      background-position: center;
      opacity: 0.22;
      z-index: 0;
      filter: saturate(1.2) sepia(0.2);
    }

    .card-content {
      position: relative;
      z-index: 2;
    }

    .lettering-title {
      font-family: 'Great Vibes', cursive;
      font-size: 3.4rem;
      color: #f7e479;
      text-shadow: 0 0 10px rgba(247, 228, 121, 0.8), 0 0 20px rgba(230, 168, 0, 0.5);
      margin-bottom: 15px;
      line-height: 1.1;
    }

    /* 1. Fuente en Garamond para el mensaje */
    .message-box {
      font-family: 'EB Garamond', Garamond, Georgia, serif;
      font-size: 1.35rem;
      line-height: 1.5;
      color: #fffde6;
      text-shadow: 0 1px 3px rgba(0, 0, 0, 0.9);
      background: rgba(10, 7, 14, 0.55);
      padding: 20px 18px;
      border-radius: 16px;
      border: 1px dashed rgba(247, 228, 121, 0.5);
      text-align: left;
      word-wrap: break-word;
    }

    /* Campo y flores amarillas */
    .flower-field {
      position: fixed;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 210px;
      pointer-events: none;
      z-index: 5;
      overflow: hidden;
    }

    .grass-base {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 80px;
      background: linear-gradient(to top, #0f2409 0%, #1d3e12 65%, transparent 100%);
      z-index: 1;
    }

    .stem-flower {
      position: absolute;
      bottom: -5px;
      display: flex;
      flex-direction: column;
      align-items: center;
      transform-origin: bottom center;
      animation: bloomGrow 2.5s cubic-bezier(0.25, 1, 0.5, 1) forwards;
    }

    @keyframes bloomGrow {
      0% { transform: translateY(110px) scale(0); opacity: 0; }
      100% { transform: translateY(0) scale(1); opacity: 1; }
    }

    .stem {
      width: 3.5px;
      background: linear-gradient(to top, #142a0b, #2b571a);
      border-radius: 2px;
    }

    /* 3. Tono amarillo suavizado */
    .flower-head {
      position: relative;
      width: 40px;
      height: 40px;
      margin-bottom: -5px;
      animation: initialSpin 2.5s ease-out forwards, continuousSpin 14s linear infinite 2.5s;
      transform-origin: center center;
      filter: drop-shadow(0 0 7px rgba(247, 228, 121, 0.65));
    }

    @keyframes initialSpin {
      0% { transform: rotate(-360deg) scale(0); }
      100% { transform: rotate(0deg) scale(1); }
    }

    @keyframes continuousSpin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .petal {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 14px;
      height: 22px;
      background: linear-gradient(to top, #e6b800 0%, #f7e479 70%, #fffdf0 100%);
      border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%;
      transform-origin: center bottom;
      box-shadow: 0 0 6px rgba(247, 228, 121, 0.5);
    }

    .flower-center {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 14px;
      height: 14px;
      background: radial-gradient(circle, #e67300 0%, #803300 100%);
      border-radius: 50%;
      z-index: 3;
      box-shadow: 0 0 5px rgba(0,0,0,0.4);
    }

    /* 2. Corazones latiendo (#ff0077) más tenues que brillan al latir */
    .beating-heart {
      position: fixed;
      pointer-events: none;
      z-index: 6;
      background-color: #ff0077;
      transform: rotate(-45deg);
      animation: heartbeatShine 1.8s infinite ease-in-out;
    }
    .beating-heart::before, .beating-heart::after {
      content: "";
      position: absolute;
      width: 100%;
      height: 100%;
      background-color: inherit;
      border-radius: 50%;
    }
    .beating-heart::before { top: -50%; left: 0; }
    .beating-heart::after { left: 50%; top: 0; }

    @keyframes heartbeatShine {
      0%, 100% {
        transform: scale(1) rotate(-45deg);
        opacity: 0.35;
        box-shadow: 0 0 2px rgba(255, 0, 119, 0.2);
      }
      25% {
        transform: scale(1.22) rotate(-45deg);
        opacity: 0.75;
        box-shadow: 0 0 12px #ff0077, 0 0 22px rgba(255, 0, 119, 0.8);
      }
      40% {
        transform: scale(0.95) rotate(-45deg);
        opacity: 0.3;
        box-shadow: 0 0 2px rgba(255, 0, 119, 0.2);
      }
      60% {
        transform: scale(1.12) rotate(-45deg);
        opacity: 0.65;
        box-shadow: 0 0 8px #ff0077, 0 0 16px rgba(255, 0, 119, 0.6);
      }
    }
  </style>
</head>
<body>

  <div class="night-sky" id="starsContainer"></div>
  <div class="butterfly-swarm" id="butterflySwarm"></div>

  <div class="content-wrapper">
    <div class="cute-card">
      <div class="card-bg-overlay"></div>
      <div class="card-content">
        <h1 class="lettering-title">te amo foquita</h1>
        <div class="message-box">
          mensaje
        </div>
      </div>
    </div>
  </div>

  <div class="flower-field" id="flowerField">
    <div class="grass-base"></div>
  </div>

  <script>
    // 1. Fondo estrellado nocturno
    const starsContainer = document.getElementById('starsContainer');
    for (let i = 0; i < 65; i++) {
      const star = document.createElement('div');
      star.className = 'star';
      const size = Math.random() * 2.5 + 1;
      star.style.width = size + 'px';
      star.style.height = size + 'px';
      star.style.left = Math.random() * 100 + '%';
      star.style.top = Math.random() * 100 + '%';
      star.style.animationDuration = (Math.random() * 3 + 2) + 's';
      starsContainer.appendChild(star);
    }

    // 2. Luciérnagas
    for (let i = 0; i < 20; i++) {
      const f = document.createElement('div');
      f.className = 'firefly';
      f.style.left = Math.random() * 100 + 'vw';
      f.style.top = Math.random() * 100 + 'vh';
      f.style.animationDuration = (Math.random() * 4 + 4) + 's';
      f.style.animationDelay = (Math.random() * 4) + 's';
      document.body.appendChild(f);
    }

    // 3. Mariposas abundantes
    const butterflySwarm = document.getElementById('butterflySwarm');
    const totalButterflies = 16;
    const butterfliesData = [];

    for (let i = 0; i < totalButterflies; i++) {
      const unit = document.createElement('div');
      unit.className = 'butterfly-unit';

      const wings = document.createElement('div');
      wings.className = 'butterfly-wings-wrapper';
      
      const color1 = i % 2 === 0 ? '#f7e479' : '#ff9ebb';
      const color2 = i % 2 === 0 ? '#e6b800' : '#ffffee';

      wings.innerHTML = `
        <svg width="26" height="24" viewBox="0 0 24 24" fill="none">
          <path d="M12 12C10 7 4 4 2 8C0 12 6 15 12 13C18 15 24 12 22 8C20 4 14 7 12 12Z" fill="${color1}"/>
          <path d="M12 12C10 16 5 20 3 17C1 14 7 12 12 13C17 12 23 14 21 17C19 20 14 16 12 12Z" fill="${color2}"/>
        </svg>
      `;

      unit.appendChild(wings);
      butterflySwarm.appendChild(unit);

      butterfliesData.push({
        el: unit,
        x: Math.random() * window.innerWidth,
        y: Math.random() * window.innerHeight,
        vx: (Math.random() - 0.5) * 1.8,
        vy: (Math.random() - 0.5) * 1.8,
        scale: 0.6 + Math.random() * 0.5
      });
    }

    function animateButterflies() {
      butterfliesData.forEach(b => {
        b.x += b.vx + Math.sin(Date.now() * 0.002 + b.x) * 0.5;
        b.y += b.vy + Math.cos(Date.now() * 0.002 + b.y) * 0.5;

        if (b.x < -30) b.x = window.innerWidth + 20;
        if (b.x > window.innerWidth + 30) b.x = -20;
        if (b.y < -30) b.y = window.innerHeight + 20;
        if (b.y > window.innerHeight + 30) b.y = -20;

        const angle = Math.atan2(b.vy, b.vx) * (180 / Math.PI) + 90;
        b.el.style.transform = `translate3d(${b.x}px, ${b.y}px, 0) scale(${b.scale}) rotate(${angle}deg)`;
      });
      requestAnimationFrame(animateButterflies);
    }
    animateButterflies();

    // 4. Cantidad de Flores disminuida ligeramente (35 flores bien distribuidas)
    const flowerField = document.getElementById('flowerField');
    const totalFlowers = 35; 

    for (let i = 0; i < totalFlowers; i++) {
      const container = document.createElement('div');
      container.className = 'stem-flower';

      const leftPos = (i / totalFlowers) * 104 - 2 + (Math.random() * 2 - 1);
      container.style.left = leftPos + '%';

      const height = Math.floor(Math.random() * 65) + 40; 
      const scale = 0.75 + (height / 105) * 0.45;

      container.style.zIndex = Math.floor(height) + 2;
      container.style.animationDelay = (Math.random() * 1.4) + 's';

      const flowerHead = document.createElement('div');
      flowerHead.className = 'flower-head';
      flowerHead.style.transform = `scale(${scale})`;

      const petalsCount = 8;
      for (let p = 0; p < petalsCount; p++) {
        const petal = document.createElement('div');
        petal.className = 'petal';
        const angle = (360 / petalsCount) * p;
        petal.style.transform = `translate(-50%, -100%) rotate(${angle}deg)`;
        flowerHead.appendChild(petal);
      }

      const center = document.createElement('div');
      center.className = 'flower-center';
      flowerHead.appendChild(center);

      container.appendChild(flowerHead);

      const stem = document.createElement('div');
      stem.className = 'stem';
      stem.style.height = height + 'px';
      container.appendChild(stem);

      flowerField.appendChild(container);
    }

    // 5. Corazones latiendo dispersos en diversas alturas de la pantalla
    const totalHearts = 10;
    for (let h = 0; h < totalHearts; h++) {
      const heart = document.createElement('div');
      heart.className = 'beating-heart';
      
      const size = Math.floor(Math.random() * 6) + 10;
      heart.style.width = size + 'px';
      heart.style.height = size + 'px';

      // Posicionamiento más disperso
      heart.style.left = (Math.random() * 88 + 6) + 'vw';
      heart.style.bottom = (Math.random() * 160 + 20) + 'px';

      heart.style.animationDelay = (Math.random() * 2) + 's';
      document.body.appendChild(heart);
    }
  </script>
</body>
</html>
