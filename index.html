<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Te amo foquita ❤️</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Great+Vibes&family=Quicksand:wght@500;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body, html {
      width: 100%;
      height: 100%;
      overflow-x: hidden;
      font-family: 'Quicksand', sans-serif;
      background: radial-gradient(circle at 50% 100%, #1c2b36 0%, #080d1a 100%);
      color: #fff;
    }

    /* Fondo nocturno y luciérnagas */
    .night-sky {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 1;
    }
    .star {
      position: absolute;
      background: #fff;
      border-radius: 50%;
      animation: twinkle infinite ease-in-out;
    }
    @keyframes twinkle {
      0%, 100% { opacity: 0.2; transform: scale(0.8); }
      50% { opacity: 1; transform: scale(1.3); }
    }

    .firefly {
      position: fixed;
      width: 5px;
      height: 5px;
      background: #ffe269;
      border-radius: 50%;
      box-shadow: 0 0 12px #ffe269, 0 0 22px #ffb700;
      pointer-events: none;
      z-index: 8;
      animation: floatFirefly linear infinite alternate;
    }
    @keyframes floatFirefly {
      0% { transform: translate(0, 0) scale(0.7); opacity: 0.3; }
      100% { transform: translate(40px, -70px) scale(1.4); opacity: 1; }
    }

    .butterfly {
      position: fixed;
      pointer-events: none;
      z-index: 9;
      animation: butterflyFly 12s linear infinite;
    }
    @keyframes butterflyFly {
      0% { transform: translate(-10vw, 90vh) scale(0.6) rotate(0deg); }
      30% { transform: translate(30vw, 60vh) scale(0.8) rotate(15deg); }
      60% { transform: translate(65vw, 25vh) scale(0.7) rotate(-10deg); }
      100% { transform: translate(110vw, -10vh) scale(0.9) rotate(5deg); }
    }

    /* Contenedor central */
    .content-wrapper {
      position: relative;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      padding: 30px 15px 320px 15px;
      z-index: 10;
    }

    /* Carta compacta y estética */
    .cute-card {
      position: relative;
      width: 100%;
      max-width: 440px;
      border-radius: 24px;
      padding: 28px 22px;
      background-color: rgba(30, 20, 25, 0.75);
      border: 2px solid rgba(255, 215, 0, 0.5);
      box-shadow: 0 12px 35px rgba(255, 215, 0, 0.2), 0 0 25px rgba(230, 100, 120, 0.25);
      backdrop-filter: blur(10px);
      text-align: center;
      overflow: hidden;
    }

    .card-bg-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-image: url('imagen.jpg');
      background-size: cover;
      background-position: center;
      opacity: 0.22;
      z-index: 0;
      filter: saturate(1.2) sepia(0.2);
    }

    .card-content {
      position: relative;
      z-index: 2;
    }

    .lettering-title {
      font-family: 'Great Vibes', cursive;
      font-size: 3.4rem;
      color: #ffd859;
      text-shadow: 0 0 10px rgba(255, 216, 89, 0.8), 0 0 20px rgba(255, 90, 120, 0.6);
      margin-bottom: 15px;
      line-height: 1.1;
    }

    .message-box {
      font-family: 'Caveat', cursive;
      font-size: 1.65rem;
      line-height: 1.45;
      color: #fffbf0;
      text-shadow: 0 2px 4px rgba(0, 0, 0, 0.85);
      background: rgba(15, 10, 18, 0.45);
      padding: 18px 16px;
      border-radius: 16px;
      border: 1px dashed rgba(255, 216, 89, 0.6);
      text-align: left;
      word-wrap: break-word;
    }

    /* Campo denso de flores generadas vectorialmente (sin emojis) */
    .flower-field {
      position: fixed;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 280px;
      pointer-events: none;
      z-index: 5;
      display: flex;
      justify-content: center;
      align-items: flex-end;
      overflow: hidden;
    }

    .stem-flower {
      position: absolute;
      bottom: -10px;
      display: flex;
      flex-direction: column;
      align-items: center;
      transform-origin: bottom center;
      animation: bloomGrow 2.8s cubic-bezier(0.25, 1, 0.5, 1) forwards;
    }

    @keyframes bloomGrow {
      0% { transform: scale(0) translateY(100px); opacity: 0; }
      100% { transform: scale(1) translateY(0); opacity: 1; }
    }

    .stem {
      width: 4px;
      background: linear-gradient(to top, #2e591b, #4e8c32);
      border-radius: 2px;
    }

    .flower-head {
      position: relative;
      width: 38px;
      height: 38px;
      margin-bottom: -6px;
    }

    .petal {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 14px;
      height: 22px;
      background: linear-gradient(to top, #ffd700, #fff275);
      border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%;
      transform-origin: center bottom;
      box-shadow: 0 0 6px rgba(255, 215, 0, 0.5);
    }

    .flower-center {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 14px;
      height: 14px;
      background: radial-gradient(circle, #ff8c00 0%, #b35900 100%);
      border-radius: 50%;
      z-index: 3;
      box-shadow: 0 0 4px rgba(0,0,0,0.3);
    }

    /* Corazones entrelazados en el campo */
    .heart-element {
      position: absolute;
      width: 18px;
      height: 18px;
      background-color: #ff5e7e;
      transform: rotate(-45deg);
      box-shadow: 0 0 8px #ff5e7e;
    }
    .heart-element::before, .heart-element::after {
      content: "";
      position: absolute;
      width: 18px;
      height: 18px;
      background-color: #ff5e7e;
      border-radius: 50%;
    }
    .heart-element::before { top: -9px; left: 0; }
    .heart-element::after { left: 9px; top: 0; }
  </style>
</head>
<body>

  <div class="night-sky" id="starsContainer"></div>

  <div class="content-wrapper">
    <div class="cute-card">
      <div class="card-bg-overlay"></div>
      <div class="card-content">
        <h1 class="lettering-title">te amo foquita</h1>
        <div class="message-box">
          te amooooooooooooooooooooooooooooo(pruebaaaaaaaaaaaa)
        </div>
      </div>
    </div>
  </div>

  <div class="flower-field" id="flowerField"></div>

  <script>
    // 1. Crear estrellas de noche
    const starsContainer = document.getElementById('starsContainer');
    for (let i = 0; i < 70; i++) {
      const star = document.createElement('div');
      star.className = 'star';
      const size = Math.random() * 2.5 + 1;
      star.style.width = size + 'px';
      star.style.height = size + 'px';
      star.style.left = Math.random() * 100 + '%';
      star.style.top = Math.random() * 100 + '%';
      star.style.animationDuration = (Math.random() * 3 + 2) + 's';
      starsContainer.appendChild(star);
    }

    // 2. Luciérnagas
    for (let i = 0; i < 22; i++) {
      const f = document.createElement('div');
      f.className = 'firefly';
      f.style.left = Math.random() * 100 + 'vw';
      f.style.top = Math.random() * 100 + 'vh';
      f.style.animationDuration = (Math.random() * 4 + 4) + 's';
      f.style.animationDelay = (Math.random() * 4) + 's';
      document.body.appendChild(f);
    }

    // 3. Mariposas SVG en miniatura
    for (let i = 0; i < 6; i++) {
      const b = document.createElement('div');
      b.className = 'butterfly';
      b.innerHTML = `
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
          <path d="M12 12C10 7 4 4 2 8C0 12 6 15 12 13C18 15 24 12 22 8C20 4 14 7 12 12Z" fill="#ffe269" opacity="0.9"/>
          <path d="M12 12C10 16 5 20 3 17C1 14 7 12 12 13C17 12 23 14 21 17C19 20 14 16 12 12Z" fill="#ff9ebb" opacity="0.8"/>
        </svg>
      `;
      b.style.animationDelay = (i * 2.2) + 's';
      b.style.animationDuration = (Math.random() * 4 + 10) + 's';
      document.body.appendChild(b);
    }

    // 4. Generar campo denso de flores amarillas vectoriales (diferentes alturas superpuestas)
    const flowerField = document.getElementById('flowerField');
    const totalFlowers = 65; 

    for (let i = 0; i < totalFlowers; i++) {
      const container = document.createElement('div');
      container.className = 'stem-flower';

      // Posición horizontal distribuida en la pantalla
      const leftPos = (i / totalFlowers) * 105 - 2.5 + (Math.random() * 2 - 1);
      container.style.left = leftPos + '%';

      // Alturas variadas: capa trasera alta, capas intermedias y bajas al frente
      const height = Math.floor(Math.random() * 130) + 100; // entre 100px y 230px
      const scale = 0.6 + (height / 230) * 0.5; // escala proporcional
      
      container.style.zIndex = Math.floor(height); // Flores más cortas quedan enfrente tapando tallos
      container.style.animationDelay = (Math.random() * 1.5) + 's';

      // Elemento de flor o corazón
      if (i % 7 === 0) {
        // Corazón en el campo
        const heart = document.createElement('div');
        heart.className = 'heart-element';
        heart.style.marginBottom = '25px';
        container.appendChild(heart);
      } else {
        // Flor vectorial amarilla
        const flowerHead = document.createElement('div');
        flowerHead.className = 'flower-head';
        flowerHead.style.transform = `scale(${scale})`;

        const petalsCount = 8;
        for (let p = 0; p < petalsCount; p++) {
          const petal = document.createElement('div');
          petal.className = 'petal';
          const angle = (360 / petalsCount) * p;
          petal.style.transform = `translate(-50%, -100%) rotate(${angle}deg)`;
          flowerHead.appendChild(petal);
        }

        const center = document.createElement('div');
        center.className = 'flower-center';
        flowerHead.appendChild(center);

        container.appendChild(flowerHead);
      }

      // Tallo verde
      const stem = document.createElement('div');
      stem.className = 'stem';
      stem.style.height = height + 'px';
      container.appendChild(stem);

      flowerField.appendChild(container);
    }
  </script>
</body>
</html>
