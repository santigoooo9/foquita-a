<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Te amo foquita ❤️</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Great+Vibes&family=Quicksand:wght@500;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body, html {
      width: 100%;
      height: 100%;
      overflow-x: hidden;
      font-family: 'Quicksand', sans-serif;
      background: radial-gradient(circle at 50% 100%, #1a2836 0%, #060a12 100%);
      color: #fff;
    }

    /* Fondo nocturno y luciérnagas */
    .night-sky {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 1;
    }
    .star {
      position: absolute;
      background: #fff;
      border-radius: 50%;
      animation: twinkle infinite ease-in-out;
    }
    @keyframes twinkle {
      0%, 100% { opacity: 0.2; transform: scale(0.8); }
      50% { opacity: 1; transform: scale(1.3); }
    }

    .firefly {
      position: fixed;
      width: 5px;
      height: 5px;
      background: #ffe269;
      border-radius: 50%;
      box-shadow: 0 0 12px #ffe269, 0 0 22px #ffb700;
      pointer-events: none;
      z-index: 8;
      animation: floatFirefly linear infinite alternate;
    }
    @keyframes floatFirefly {
      0% { transform: translate(0, 0) scale(0.7); opacity: 0.3; }
      100% { transform: translate(40px, -70px) scale(1.4); opacity: 1; }
    }

    /* SISTEMA DE MARIPOSAS ANIMADAS Y ALETEANDO */
    .butterfly-wrapper {
      position: fixed;
      pointer-events: none;
      z-index: 9;
      top: 0;
      left: 0;
      animation: flyTrajectory linear infinite;
    }

    .butterfly-body {
      position: relative;
      width: 30px;
      height: 30px;
      display: flex;
      justify-content: center;
      align-items: center;
      filter: drop-shadow(0 0 8px rgba(255, 230, 110, 0.8));
    }

    /* Aleteo dinámico de las alas */
    .wing-left {
      transform-origin: right center;
      animation: flapLeft 0.25s ease-in-out infinite alternate;
    }
    .wing-right {
      transform-origin: left center;
      animation: flapRight 0.25s ease-in-out infinite alternate;
    }

    @keyframes flapLeft {
      0% { transform: scaleX(1) rotate(0deg); }
      100% { transform: scaleX(0.15) rotate(10deg); }
    }

    @keyframes flapRight {
      0% { transform: scaleX(1) rotate(0deg); }
      100% { transform: scaleX(0.15) rotate(-10deg); }
    }

    /* Trayectorias de vuelo suaves por la pantalla */
    @keyframes flyTrajectory {
      0% {
        transform: translate(-10vw, 85vh) rotate(15deg);
      }
      25% {
        transform: translate(25vw, 35vh) rotate(-10deg);
      }
      50% {
        transform: translate(65vw, 60vh) rotate(20deg);
      }
      75% {
        transform: translate(85vw, 15vh) rotate(-5deg);
      }
      100% {
        transform: translate(110vw, 75vh) rotate(10deg);
      }
    }

    /* Contenedor central */
    .content-wrapper {
      position: relative;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      padding: 30px 15px 280px 15px;
      z-index: 10;
    }

    /* Carta compacta y estética */
    .cute-card {
      position: relative;
      width: 100%;
      max-width: 440px;
      border-radius: 24px;
      padding: 28px 22px;
      background-color: rgba(28, 18, 24, 0.78);
      border: 2px solid rgba(255, 215, 0, 0.5);
      box-shadow: 0 12px 35px rgba(255, 215, 0, 0.2), 0 0 25px rgba(255, 0, 119, 0.25);
      backdrop-filter: blur(10px);
      text-align: center;
      overflow: hidden;
    }

    .card-bg-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-image: url('imagen.jpg');
      background-size: cover;
      background-position: center;
      opacity: 0.22;
      z-index: 0;
      filter: saturate(1.2) sepia(0.2);
    }

    .card-content {
      position: relative;
      z-index: 2;
    }

    .lettering-title {
      font-family: 'Great Vibes', cursive;
      font-size: 3.4rem;
      color: #ffd859;
      text-shadow: 0 0 10px rgba(255, 216, 89, 0.8), 0 0 20px rgba(255, 0, 119, 0.6);
      margin-bottom: 15px;
      line-height: 1.1;
    }

    .message-box {
      font-family: 'Caveat', cursive;
      font-size: 1.65rem;
      line-height: 1.45;
      color: #fffbf0;
      text-shadow: 0 2px 4px rgba(0, 0, 0, 0.85);
      background: rgba(12, 8, 15, 0.5);
      padding: 18px 16px;
      border-radius: 16px;
      border: 1px dashed rgba(255, 216, 89, 0.6);
      text-align: left;
      word-wrap: break-word;
    }

    /* Campo tupido de flores */
    .flower-field {
      position: fixed;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 220px;
      pointer-events: none;
      z-index: 5;
      overflow: hidden;
    }

    .grass-base {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 90px;
      background: linear-gradient(to top, #16330c 0%, #295719 70%, transparent 100%);
      z-index: 1;
    }

    .stem-flower {
      position: absolute;
      bottom: -5px;
      display: flex;
      flex-direction: column;
      align-items: center;
      transform-origin: bottom center;
      animation: bloomGrow 2.5s cubic-bezier(0.25, 1, 0.5, 1) forwards;
    }

    @keyframes bloomGrow {
      0% { transform: translateY(120px) scale(0); opacity: 0; }
      100% { transform: translateY(0) scale(1); opacity: 1; }
    }

    .stem {
      width: 3.5px;
      background: linear-gradient(to top, #1c3b10, #3d7328);
      border-radius: 2px;
    }

    /* Animación de apertura y rotación continua de flores */
    .flower-head {
      position: relative;
      width: 36px;
      height: 36px;
      margin-bottom: -5px;
      animation: initialSpin 2.5s ease-out forwards, continuousSpin 12s linear infinite 2.5s;
      transform-origin: center center;
    }

    @keyframes initialSpin {
      0% { transform: rotate(-360deg) scale(0); }
      100% { transform: rotate(0deg) scale(1); }
    }

    @keyframes continuousSpin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .petal {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 13px;
      height: 20px;
      background: linear-gradient(to top, #ffd700, #fff275);
      border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%;
      transform-origin: center bottom;
      box-shadow: 0 0 5px rgba(255, 215, 0, 0.4);
    }

    .flower-center {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 13px;
      height: 13px;
      background: radial-gradient(circle, #ff8c00 0%, #b35900 100%);
      border-radius: 50%;
      z-index: 3;
      box-shadow: 0 0 4px rgba(0,0,0,0.4);
    }

    /* Corazones latiendo (#ff0077) sin tallo */
    .beating-heart {
      position: fixed;
      pointer-events: none;
      z-index: 6;
      background-color: #ff0077;
      transform: rotate(-45deg);
      box-shadow: 0 0 10px #ff0077, 0 0 20px rgba(255, 0, 119, 0.6);
      animation: heartbeat 1.5s infinite ease-in-out;
    }
    .beating-heart::before, .beating-heart::after {
      content: "";
      position: absolute;
      width: 100%;
      height: 100%;
      background-color: #ff0077;
      border-radius: 50%;
    }
    .beating-heart::before { top: -50%; left: 0; }
    .beating-heart::after { left: 50%; top: 0; }

    @keyframes heartbeat {
      0%, 100% { transform: scale(1) rotate(-45deg); }
      25% { transform: scale(1.18) rotate(-45deg); }
      40% { transform: scale(0.98) rotate(-45deg); }
      60% { transform: scale(1.12) rotate(-45deg); }
    }
  </style>
</head>
<body>

  <div class="night-sky" id="starsContainer"></div>

  <div class="content-wrapper">
    <div class="cute-card">
      <div class="card-bg-overlay"></div>
      <div class="card-content">
        <h1 class="lettering-title">te amo foquita</h1>
        <div class="message-box">
          mensaje
        </div>
      </div>
    </div>
  </div>

  <div class="flower-field" id="flowerField">
    <div class="grass-base"></div>
  </div>

  <script>
    // 1. Estrellas
    const starsContainer = document.getElementById('starsContainer');
    for (let i = 0; i < 70; i++) {
      const star = document.createElement('div');
      star.className = 'star';
      const size = Math.random() * 2.5 + 1;
      star.style.width = size + 'px';
      star.style.height = size + 'px';
      star.style.left = Math.random() * 100 + '%';
      star.style.top = Math.random() * 100 + '%';
      star.style.animationDuration = (Math.random() * 3 + 2) + 's';
      starsContainer.appendChild(star);
    }

    // 2. Luciérnagas
    for (let i = 0; i < 22; i++) {
      const f = document.createElement('div');
      f.className = 'firefly';
      f.style.left = Math.random() * 100 + 'vw';
      f.style.top = Math.random() * 100 + 'vh';
      f.style.animationDuration = (Math.random() * 4 + 4) + 's';
      f.style.animationDelay = (Math.random() * 4) + 's';
      document.body.appendChild(f);
    }

    // 3. GENERACIÓN DE MUCHAS MARIPOSAS VOLANDO Y ALETEANDO
    const totalButterflies = 14; // Cantidad de mariposas
    const colors = ['#ffe269', '#ff8da9', '#ffd15c', '#ff5e91', '#ffffff'];

    for (let i = 0; i < totalButterflies; i++) {
      const wrapper = document.createElement('div');
      wrapper.className = 'butterfly-wrapper';

      // Ajustes de vuelo y tiempos
      const duration = Math.random() * 6 + 10; // Duración de recorrido
      const delay = Math.random() * 8; // Tiempo de desfase entre cada una
      const scale = Math.random() * 0.4 + 0.6; // Tamaños variados (miniatures a medianas)
      
      wrapper.style.animationDuration = duration + 's';
      wrapper.style.animationDelay = delay + 's';

      const colorWing = colors[i % colors.length];

      wrapper.innerHTML = `
        <div class="butterfly-body" style="transform: scale(${scale});">
          <svg width="28" height="28" viewBox="0 0 24 24" style="position: absolute;">
            <!-- Ala Izquierda -->
            <path class="wing-left" fill="${colorWing}" d="M12,12 C10,4 2,2 1,7 C0,12 8,15 12,13 C10,16 3,21 2,18 C1,15 9,13 12,12 Z"/>
            <!-- Ala Derecha -->
            <path class="wing-right" fill="${colorWing}" d="M12,12 C14,4 22,2 23,7 C24,12 16,15 12,13 C14,16 21,21 22,18 C23,15 15,13 12,12 Z"/>
            <!-- Cuerpo miniatura -->
            <ellipse cx="12" cy="12" rx="1" ry="5" fill="#332211"/>
          </svg>
        </div>
      `;

      document.body.appendChild(wrapper);
    }

    // 4. Campo de flores amarillas
    const flowerField = document.getElementById('flowerField');
    const totalFlowers = 85;

    for (let i = 0; i < totalFlowers; i++) {
      const container = document.createElement('div');
      container.className = 'stem-flower';

      const leftPos = (i / totalFlowers) * 106 - 3 + (Math.random() * 1.5 - 0.75);
      container.style.left = leftPos + '%';

      const height = Math.floor(Math.random() * 70) + 45; 
      const scale = 0.65 + (height / 115) * 0.45;

      container.style.zIndex = Math.floor(height) + 2;
      container.style.animationDelay = (Math.random() * 1.6) + 's';

      const flowerHead = document.createElement('div');
      flowerHead.className = 'flower-head';
      flowerHead.style.transform = `scale(${scale})`;

      const petalsCount = 8;
      for (let p = 0; p < petalsCount; p++) {
        const petal = document.createElement('div');
        petal.className = 'petal';
        const angle = (360 / petalsCount) * p;
        petal.style.transform = `translate(-50%, -100%) rotate(${angle}deg)`;
        flowerHead.appendChild(petal);
      }

      const center = document.createElement('div');
      center.className = 'flower-center';
      flowerHead.appendChild(center);

      container.appendChild(flowerHead);

      const stem = document.createElement('div');
      stem.className = 'stem';
      stem.style.height = height + 'px';
      container.appendChild(stem);

      flowerField.appendChild(container);
    }

    // 5. Corazones latiendo (#ff0077)
    const totalHearts = 12;
    for (let h = 0; h < totalHearts; h++) {
      const heart = document.createElement('div');
      heart.className = 'beating-heart';
      
      const size = Math.floor(Math.random() * 8) + 10;
      heart.style.width = size + 'px';
      heart.style.height = size + 'px';

      heart.style.left = (Math.random() * 92 + 4) + 'vw';
      heart.style.bottom = (Math.random() * 120 + 20) + 'px';

      heart.style.animationDelay = (Math.random() * 1.5) + 's';
      document.body.appendChild(heart);
    }
  </script>
</body>
</html>
